<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" type="image/png" href="<%= BASE_URL %>favicon.png">
    <link rel="stylesheet" type="text/css" media="print" href="<%= BASE_URL %>print-lock.css">
    <title><%= webpackConfig.name %></title>
    <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
	  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }
    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999999;
      background: #0d1420;
    }

    #loader {
      display: block;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 90px;
      height: 90px;
      margin: -55px 0 0 -45px;
      animation: spin 2.4s linear infinite;
    }

    #loader svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loader-wrapper .load_title {
      font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
      color: #cdd6e0;
      font-size: 15px;
      letter-spacing: 2px;
      width: 100%;
      text-align: center;
      z-index: 9999999999999;
      position: absolute;
      top: calc(50% + 60px);
      opacity: 1;
      line-height: 30px;
    }

    @keyframes spin {
      0% {
        -webkit-transform: rotate(0deg);
        transform: rotate(0deg);
      }
      100% {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }
  </style>
  </head>
  <body>
    <div id="app">
      <div id="loader-wrapper">
        <div id="loader">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <g fill="#f5a623">
              <rect x="90" y="0" width="20" height="38" rx="4"/>
              <rect x="90" y="0" width="20" height="38" rx="4" transform="rotate(45 100 100)"/>
              <rect x="90" y="0" width="20" height="38" rx="4" transform="rotate(90 100 100)"/>
              <rect x="90" y="0" width="20" height="38" rx="4" transform="rotate(135 100 100)"/>
              <rect x="90" y="0" width="20" height="38" rx="4" transform="rotate(180 100 100)"/>
              <rect x="90" y="0" width="20" height="38" rx="4" transform="rotate(225 100 100)"/>
              <rect x="90" y="0" width="20" height="38" rx="4" transform="rotate(270 100 100)"/>
              <rect x="90" y="0" width="20" height="38" rx="4" transform="rotate(315 100 100)"/>
              <circle cx="100" cy="100" r="56"/>
            </g>
            <circle cx="100" cy="100" r="20" fill="#0d1420"/>
            <circle cx="100" cy="100" r="8" fill="#f5a623"/>
          </svg>
        </div>
        <div class="load_title">正在加载系统资源，请耐心等待</div>
      </div>
    </div>
  </body>
</html>
